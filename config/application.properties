# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/camfu_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Shivam@9797
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Python AI Engine Configuration
ai.engine.url=http://localhost:5000
ai.engine.timeout=30000
ai.engine.max-retries=3

# Feed Configuration
feed.update-interval=2000
feed.max-feeds=64
feed.priority-threshold=0.5

# Logging
logging.level.root=INFO
logging.level.com.camfu=DEBUG
